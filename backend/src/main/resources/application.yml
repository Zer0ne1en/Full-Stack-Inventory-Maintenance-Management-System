spring:
  application:
    name: mainspring-cmms

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cmms}
    username: ${DB_USER:cmms}
    password: ${DB_PASSWORD:cmms}
    hikari:
      maximum-pool-size: 10
      pool-name: MainspringHikari

  jpa:
    open-in-view: false          # lazy loading must happen inside the service layer
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only verifies it
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

app:
  name: Mainspring CMMS
  seed-demo-data: ${SEED_DEMO_DATA:true}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  jwt:
    # Override in every real environment: `openssl rand -base64 48`
    secret: ${JWT_SECRET:change-me-in-production-this-value-must-be-at-least-32-bytes-long}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
    issuer: mainspring-cmms

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

  alerts:
    # Every 15 minutes. Spring cron is second minute hour day-of-month month day-of-week.
    cron: "${ALERT_CRON:0 */15 * * * *}"
    email-enabled: ${ALERT_EMAIL_ENABLED:false}
    email-recipient: ${ALERT_EMAIL_RECIPIENT:}
    email-from: ${ALERT_EMAIL_FROM:no-reply@mainspring.local}
    overdue-after-hours: ${ALERT_OVERDUE_HOURS:72}
    service-window-days: ${ALERT_SERVICE_WINDOW_DAYS:14}

logging:
  level:
    com.mainspring.cmms: INFO
    org.hibernate.SQL: WARN
