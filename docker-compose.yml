# =====================================================================
# Mainspring — full stack, one command.
#
#   docker compose up --build
#   UI  -> http://localhost:3000
#   API -> http://localhost:8080/swagger-ui.html
#
# Postgres data survives restarts in the named volume.
# =====================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: mainspring-db
    environment:
      POSTGRES_DB: ${DB_NAME:-cmms}
      POSTGRES_USER: ${DB_USER:-cmms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cmms}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cmms} -d ${DB_NAME:-cmms}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [mainspring]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mainspring-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cmms}
      DB_USER: ${DB_USER:-cmms}
      DB_PASSWORD: ${DB_PASSWORD:-cmms}
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-please-override-in-production-min-32-bytes}
      SEED_DEMO_DATA: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALERT_EMAIL_ENABLED: ${ALERT_EMAIL_ENABLED:-false}
      ALERT_EMAIL_RECIPIENT: ${ALERT_EMAIL_RECIPIENT:-ops@mainspring.local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [mainspring]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mainspring-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
    networks: [mainspring]

volumes:
  pgdata:

networks:
  mainspring:
    driver: bridge
